<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MathSDK UI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" class="grid">
        <!-- Settings Panel -->
        <aside class="card">
            <h2>Global Settings</h2>
            <div class="input-group">
                <label>Simulations Count</label>
                <input v-model.number="sims" type="number">
            </div>
            <div class="input-group">
                <label>Config Path</label>
                <input v-model="configPath" type="text">
            </div>
            <div class="input-group">
                <label>Output Directory</label>
                <input v-model="outputDir" type="text">
            </div>
            <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
            <button class="btn btn-success" @click="runSims" style="width:100%">▶ Run Simulations</button>
            <div style="display:flex;">
                <button class="btn btn-primary" style="flex:1;" @click="invoke('save', configPath)">💾 Save</button>
                <button class="btn btn-warning" style="flex:1;" @click="invoke('load', configPath)">📂 Import</button>
            </div>
            <button class="btn" style="background:#9b59b6; color:white; width:100%" @click="invoke('export', outputDir)">🚀 Export for Stake Engine</button>
            <button class="btn" style="background:#555; width:100%" @click="refresh">🔄 Refresh Data</button>
        </aside>

        <!-- Main Editor -->
        <main>
            <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Game Modes ({{ modes.length }})</h2>
                <button class="btn btn-primary" @click="addMode">+ New Mode</button>
            </div>

            <div v-for="(mode, idx) in modes" :key="idx" class="card mode-card">
                <div style="display:flex; justify-content:space-between;">
                    <div style="flex:1;">
                        <div style="display:flex; gap:10px; margin-bottom:15px;">
                            <div style="flex:2;">
                                <label>Mode Name</label>
                                <input v-model="mode.name" @change="updateModeName(idx)">
                            </div>
                            <div style="flex:1;">
                                <label>Cost</label>
                                <input v-model.number="mode.cost" type="number" @change="updateModeCost(idx)">
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-danger" @click="removeMode(idx)">🗑</button>
                </div>

                <div style="display:flex; align-items:center;">
                    <h3>Multipliers</h3>
                    <span v-if="mode.simulated" class="badge badge-sim">Simulated</span>
                    <span v-else class="badge badge-nosim">Not Simulated</span>
                </div>
                
                <table class="multiplier-table">
                    <thead>
                        <tr>
                            <th>Value (x)</th>
                            <th>Weight</th>
                            <th>Prob %</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(m, mIdx) in mode.multipliers" :key="mIdx">
                            <td><input v-model.number="m.m" type="number" step="0.1" @change="updateMultiplier(idx, mIdx)"></td>
                            <td><input v-model.number="m.w" type="number" @change="updateMultiplier(idx, mIdx)"></td>
                            <td style="color:#888;">{{ calculateProb(mode, mIdx) }}%</td>
                            <td><button class="btn btn-danger" @click="removeMultiplier(idx, mIdx)" style="padding:2px 8px;">×</button></td>
                        </tr>
                    </tbody>
                </table>
                <button class="btn" style="background:#333" @click="addMultiplier(idx)">+ Add Multiplier</button>

                <div class="fs-section">
                    <div style="display:flex; align-items:center; margin-bottom:10px;">
                        <h3 style="margin:0; color:#f39c12;">Free Spins</h3>
                        <input type="checkbox" v-model="mode.freeSpins.enabled" @change="updateFreeSpins(idx)" style="margin-left:15px;">
                        <span style="font-size:0.8em; color:#888;">{{ mode.freeSpins.enabled ? 'Enabled' : 'Disabled' }}</span>
                    </div>
                    
                    <div v-if="mode.freeSpins.enabled" style="display:grid; grid-template-columns: repeat(2, 1fr); gap:10px;">
                        <div class="input-group">
                            <label>Trigger Weight</label>
                            <input v-model.number="mode.freeSpins.triggerWeight" type="number" @change="updateFreeSpins(idx)">
                        </div>
                        <div class="input-group">
                            <label>Spins Count</label>
                            <input v-model.number="mode.freeSpins.count" type="number" @change="updateFreeSpins(idx)">
                        </div>
                        <div class="input-group">
                            <label>Multiplier Boost (x)</label>
                            <input v-model.number="mode.freeSpins.multiplierBoost" type="number" step="0.1" @change="updateFreeSpins(idx)">
                        </div>
                        <div style="display:flex; align-items:center;">
                            <input type="checkbox" v-model="mode.freeSpins.canRetrigger" @change="updateFreeSpins(idx)">
                            <label style="display:inline; margin:0;">Can Retrigger</label>
                        </div>
                    </div>
                </div>

                <div class="stats" v-if="mode.rtp !== undefined" style="margin-top:20px; border-top:1px solid #333; padding-top:10px;">
                    <span>Expected RTP: <b :class="mode.rtp > 0.95 ? 'rtp-high' : 'rtp-low'">{{ (mode.rtp * 100).toFixed(2) }}%</b></span>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
